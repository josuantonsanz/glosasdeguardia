            var noteHeader = document.querySelector('.note-header');
            var update = function () {
                var pastTitle = noteHeader
                    ? noteHeader.getBoundingClientRect().bottom < 60
                    : window.scrollY > 10;

            window.addEventListener('resize', update);
            update();
        })();
